# Sunshine Education local development virtual hosts (XAMPP / Apache 2.4)
# Include this file from C:/xampp/apache/conf/extra/httpd-vhosts.conf.

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    DocumentRoot "C:/xampp/htdocs"

    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/localhost-error.log"
    CustomLog "logs/localhost-access.log" combined
</VirtualHost>

<VirtualHost *:80>
    ServerName sunshine.test

    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:5173/$1 [P,L]
    ProxyPass / http://127.0.0.1:5173/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:5173/

    ErrorLog "logs/sunshine.test-error.log"
    CustomLog "logs/sunshine.test-access.log" combined
</VirtualHost>

<VirtualHost *:80>
    ServerName api.sunshine.test
    DocumentRoot "C:/xampp/htdocs/sunshine-api"

    SetEnv DB_HOST "localhost"
    SetEnv DB_PORT "3306"
    SetEnv DB_NAME "sunshine_education"
    SetEnv DB_USER "root"
    SetEnv DB_PASS ""

    <Directory "C:/xampp/htdocs/sunshine-api">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SetEnvIf Origin "^http://sunshine\.test$" sunshine_local_origin
    Header always unset Access-Control-Allow-Origin
    Header always unset Access-Control-Allow-Credentials
    Header always unset Access-Control-Allow-Methods
    Header always unset Access-Control-Allow-Headers
    Header always unset Vary
    Header always set Access-Control-Allow-Origin "http://sunshine.test" env=sunshine_local_origin
    Header always set Access-Control-Allow-Credentials "true" env=sunshine_local_origin
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" env=sunshine_local_origin
    Header always set Access-Control-Allow-Headers "Content-Type, Accept, Authorization, X-Requested-With" env=sunshine_local_origin
    Header always set Vary "Origin" env=sunshine_local_origin
    Header always edit Access-Control-Allow-Origin "^http://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$" "http://sunshine.test"
    Header always edit Access-Control-Allow-Origin "^http://sunshine\\.test$" "http://sunshine.test"

    php_admin_value auto_prepend_file "C:/xampp/htdocs/sunshine-api/config/local_bootstrap.php"

    ErrorLog "logs/api.sunshine.test-error.log"
    CustomLog "logs/api.sunshine.test-access.log" combined
</VirtualHost>